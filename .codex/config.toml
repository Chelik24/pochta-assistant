# Настройки Codex для этой папки.
#
# ВАЖНО: этот файл читается, только если папка помечена как доверенная.
# При первом запуске Codex в этой папке ответьте, что доверяете проекту,
# иначе настройки молча не применятся.

# Не переспрашивать разрешение на каждую команду: команды приходят с телефона,
# и подтверждать каждый шаг неудобно.
approval_policy = "never"

# Писать можно только внутри этой папки. Всё остальное на диске недоступно.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Нужен доступ в сеть: без него не подключиться к imap.mail.ru.
network_access = true

# --- Необязательное усиление ---------------------------------------------
# Раскомментируйте, чтобы скрипты из этой папки могли ходить ТОЛЬКО на почту.
# Тогда даже сломанный скрипт не отправит данные наружу.
# Если после включения Codex начнёт падать на сетевых ошибках — закомментируйте
# обратно, это ограничение, а не обязательная часть.
#
# [features.network_proxy]
# enabled = true
# domains = { "imap.mail.ru" = "allow", "api.openai.com" = "allow", "chatgpt.com" = "allow" }
